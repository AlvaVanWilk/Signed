<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0c14">
  <title>Signed</title>
  <link rel="icon" href="assets/img/favicon.png" type="image/png" sizes="64x64">
  <link rel="icon" href="assets/img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Signed">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/label.css">
  <script>
    // Testversion (Ordner mit „-test“): anderes Logo und anderes Symbol für den Home-Bildschirm,
    // damit man sie nicht mit dem echten Spiel verwechselt.
    if (/-test(\/|$)/.test(location.pathname)) {
      document.documentElement.classList.add('is-test');
      document.title = 'Signed Test';
      const icons = { 'assets/img/favicon.png': 'test-favicon.png', 'assets/img/icon-192.png': 'test-icon-192.png', 'assets/img/apple-touch-icon.png': 'test-apple-touch-icon.png' };
      for (const link of document.querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"]')) {
        const name = icons[link.getAttribute('href')];
        if (name) link.setAttribute('href', 'assets/img/' + name);
      }
      document.querySelector('link[rel="manifest"]')?.setAttribute('href', 'manifest-test.webmanifest');
      document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute('content', 'Signed Test');
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0d4a4f');
    }
  </script>
</head>
<body>
  <div id="app"><div class="boot"><span class="logo">Signed</span></div></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript>Signed braucht JavaScript.</noscript>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
