<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed – Probe: Cover-Automat</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    :root { --gold: #ffc23d; --blue: #4f8bff; --green: #3ddc97; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #f3eefc; background: #0e0c14; }
    main { max-width: 900px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.2rem; margin: 0 0 4px; }
    h2 { font-size: 1rem; margin: 24px 0 8px; color: #a49bbd; text-transform: uppercase; letter-spacing: 0.06em; }
    p { color: #a49bbd; margin: 4px 0; }
    button { font: inherit; font-weight: 800; padding: 12px 22px; border-radius: 999px; border: 0; background: #ff4f8b; color: #fff; touch-action: manipulation; }
    button.ghost { background: #2a2338; }
    .machine { background: linear-gradient(180deg, #2a1f3d, #1a1424); border-radius: 22px; padding: 16px; box-shadow: inset 0 0 0 2px #3a2f52; }
    .controls { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .stop { font-size: 1.3rem; padding: 16px 48px; }
    .result { display: grid; grid-template-columns: minmax(200px, 320px) 1fr; gap: 20px; align-items: center; margin-top: 18px; }
    @media (max-width: 600px) { .result { grid-template-columns: 1fr; } .reel-row { grid-template-columns: 1fr; } }
    .cover { width: 100%; height: auto; display: block; border-radius: 6px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    .cover-frame { padding: 8px; border-radius: 10px; background: #2a2338; }
    .cover-frame.q1 { background: var(--green); }
    .cover-frame.q2 { background: var(--blue); }
    .cover-frame.q3 { background: linear-gradient(135deg, #fff1b8, var(--gold), #b8860b, var(--gold)); }
    .chips span { display: inline-block; margin: 2px 4px 2px 0; padding: 3px 10px; border-radius: 999px; background: #2a2338; font-size: 0.85rem; font-weight: 700; }
    .chips .r1 { box-shadow: inset 0 0 0 2px var(--green); }
    .chips .r2 { box-shadow: inset 0 0 0 2px var(--blue); }
    .chips .r3 { box-shadow: inset 0 0 0 2px var(--gold); color: var(--gold); }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .gallery figure { margin: 0; }
    .gallery figcaption { font-size: 0.8rem; color: #a49bbd; margin-top: 4px; }
    .tune { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.85rem; color: #a49bbd; margin-top: 10px; }
  </style>
</head>
<body>
<main>
  <h1>Probe: Cover-Automat</h1>
  <p>Vier Bänder laufen nacheinander. Tippe aufs Band oder auf „Stopp!“ (oder Leertaste), wenn das Feld im weißen Rahmen ist.
    Das Feld im Rahmen gilt. <b style="color:var(--green)">Grün</b>, <b style="color:var(--blue)">blau</b> und
    <b style="color:var(--gold)">gold</b> umrandete Felder machen das Cover wertvoller.</p>

  <div class="machine">
    <div class="reels"></div>
    <div class="tune">
      <label>Tempo <input type="range" min="0.5" max="1.8" step="0.1" value="1" data-speed> <b data-speed-out>1,0</b></label>
      <button class="ghost" data-restart>Neu (nur in der Probe)</button>
    </div>
  </div>

  <div class="result" hidden></div>

  <h2>Zufällige Cover – von gewöhnlich bis gold</h2>
  <div class="gallery"></div>
  <p><button class="ghost" data-more>Andere Cover</button></p>
</main>
<script type="module">
  import { LAYOUTS, MOTIFS, PALETTES, STYLES, coverQuality, coverSvg } from './assets/js/cover.js';
  import { createCoverMachine, reelLabel } from './assets/js/cover-machine.js';

  const CELLS = 14;
  const RARITY_COUNTS = [8, 3, 2, 1];
  const SPEEDS = [6, 7.5, 9, 10.5];
  const pick = (list) => list[Math.floor(Math.random() * list.length)];
  const shuffle = (list) => list.map((x) => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map((x) => x[1]);
  const OPTIONS = { motif: Object.keys(MOTIFS), palette: Object.keys(PALETTES), style: Object.keys(STYLES), layout: Object.keys(LAYOUTS) };
  const $ = (s) => document.querySelector(s);
  let machine = null;

  function buildReel(key) {
    let pool = [];
    const items = shuffle(RARITY_COUNTS.flatMap((n, r) => Array(n).fill(r))).map((rarity) => {
      if (!pool.length) pool = shuffle(OPTIONS[key]);
      return { key: pool.pop(), rarity };
    });
    return { key, items };
  }

  function start() {
    machine?.destroy();
    $('.result').hidden = true;
    const reels = Object.keys(OPTIONS).map(buildReel);
    const factor = Number($('[data-speed]').value);
    machine = createCoverMachine($('.reels'), { reels, speeds: SPEEDS.map((s) => s * factor), onDone: (picks) => showResult(reels, picks) });
  }

  function showResult(reels, picks) {
    const items = reels.map((r, i) => r.items[picks[i]]);
    const spec = { motif: items[0].key, palette: items[1].key, style: items[2].key, layout: items[3].key, rarity: items.map((p) => p.rarity) };
    const q = coverQuality(spec.rarity);
    const tier = spec.rarity.includes(3) ? 3 : q >= 0.3 ? 2 : q > 0 ? 1 : 0;
    $('.result').hidden = false;
    $('.result').innerHTML = `
      <div class="cover-frame q${tier}">${coverSvg(spec, { band: 'Die Kellerkinder', title: pick(['Laut im Keller', 'Mondsüchtig', 'Funkenflug', 'Zuckerwatte', 'Nachtschicht']) })}</div>
      <div>
        <h2 style="margin-top:0">Dein Cover</h2>
        <div class="chips">${reels.map((r, i) => `<span class="r${items[i].rarity}">${reelLabel(r.key, items[i].key)}</span>`).join('')}</div>
        <p>Cover-Güte <b style="color:#fff">${Math.round(q * 100)} %</b> → Verkauf <b style="color:#fff">+${Math.round(q * 10)} %</b></p>
        <p>${q === 0 ? 'Lauter gewöhnliche Felder: Das Cover sieht blass und etwas verwaschen aus.' : tier === 3 ? 'Gold! Glänzende Folie.' : tier === 2 ? 'Schön klar und mit Glanz.' : 'Schon etwas kräftiger.'}</p>
      </div>`;
  }

  function gallery() {
    const combos = [];
    for (let i = 0; i < 12; i++) {
      const level = Math.floor(i / 3);
      const rarity = [0, 1, 2, 3].map(() => (level === 0 ? 0 : Math.max(0, Math.min(3, level + Math.floor(Math.random() * 3) - 1))));
      combos.push({ motif: pick(OPTIONS.motif), palette: pick(OPTIONS.palette), style: pick(OPTIONS.style), layout: pick(OPTIONS.layout), rarity });
    }
    combos.sort((a, b) => coverQuality(a.rarity) - coverQuality(b.rarity));
    $('.gallery').innerHTML = combos.map((c) => `<figure>${coverSvg(c, { band: pick(['Kellerkinder', 'Neon Hasen', 'Die Wolken', 'Blech & Bass']), title: pick(['Laut im Keller', 'Mondsüchtig', 'Funkenflug']) })}
      <figcaption>${STYLES[c.style].name} · ${PALETTES[c.palette].name} · Güte ${Math.round(coverQuality(c.rarity) * 100)} %</figcaption></figure>`).join('');
  }

  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-restart]')) start();
    if (e.target.closest('[data-more]')) gallery();
  });
  $('[data-speed]').addEventListener('input', (e) => { $('[data-speed-out]').textContent = Number(e.target.value).toFixed(1).replace('.', ','); });
  start();
  gallery();
</script>
</body>
</html>
