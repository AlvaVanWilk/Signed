<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed – Probe: Figuren</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #f3eefc; background: #0e0c14; }
    header { padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    h1 { font-size: 1.2rem; margin: 0; }
    button { font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 999px; border: 0; background: #ff4f8b; color: #fff; }
    label { font-size: 0.9rem; color: #a49bbd; }
    .stage { margin: 0 16px 16px; padding: 24px 12px 12px; border-radius: 18px;
      background: radial-gradient(ellipse at 50% 0%, rgba(255, 214, 120, 0.25), transparent 60%), linear-gradient(180deg, #241b33, #15111e 70%, #3a2a1f 70%, #2a1e16);
      display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 4px; }
    .member { width: min(30vw, 190px); text-align: center; }
    .member small { display: block; color: #a49bbd; margin-top: -4px; }
    p.hint { margin: 0 16px; color: #a49bbd; font-size: 0.9rem; }

  </style>
</head>
<body>
  <header>
    <h1>Probe: niedliche Musiker-Figuren</h1>
    <div>
      <label>Tempo <input type="range" min="70" max="160" value="120" data-tempo></label>
      <button data-new>Andere Musiker</button>
    </div>
  </header>
  <div class="stage"></div>
  <p class="hint">Alle Haltungen auf einen Blick. Im Spiel: Live-Ansicht von Auftritten, Band-Seite, Band-Ansicht in den Charts.</p>
  <script type="module">
    import { figure } from './assets/js/figure.js';

    const pick = (list) => list[Math.floor(Math.random() * list.length)];
    const SKINS = ['#f5d6c0', '#eac0a0', '#d9a27e', '#b97a56', '#8d5a3b', '#5e3a24'];
    const HAIR = ['#1f1a17', '#3b2a20', '#6b4423', '#a0522d', '#d8b26e', '#e8d9a8', '#ff4f8b', '#4fd1ff', '#9b7bff'];
    const SHIRTS = ['#4a6fa5', '#e4572e', '#3ddc97', '#9b7bff', '#ffb547', '#2b2d42', '#ff4f8b'];
    const NAMES = { f: ['Mia', 'Leni', 'Nika', 'Ada', 'Hira'], m: ['Ben', 'Oskar', 'Jonas', 'Leon', 'Kenji'] };
    const BAND = [['vocals', 'Gesang'], ['guitar', 'Gitarre'], ['bass', 'Bass'], ['keys', 'Keyboard'], ['drums', 'Schlagzeug'], ['violin', 'Geige'], ['sax', 'Saxophon'], ['trumpet', 'Trompete'], ['flute', 'Flöte'], ['turntables', 'Turntables']];

    function look() {
      const gender = pick(['f', 'm']);
      return {
        gender,
        skin: pick(SKINS),
        hairColor: pick(HAIR),
        hair: pick(gender === 'f' ? ['lang', 'bob', 'zopf', 'dutt', 'locken', 'afro'] : ['kurz', 'locken', 'afro', 'sidecut', 'irokese', 'kurz']),
        shirt: pick(SHIRTS),
        glasses: pick(['none', 'none', 'round', 'square', 'sun']),
        hat: pick(['none', 'none', 'none', 'beanie', 'cap', 'fedora']),
        beard: gender === 'm' ? pick(['none', 'none', 'stubble', 'full']) : 'none',
        freckles: Math.random() < 0.3,
        name: pick(NAMES[gender]),
      };
    }

    const stage = document.querySelector('.stage');
    function draw() {
      stage.innerHTML = BAND.map(([type, label]) => {
        const l = look();
        return `<div class="member">${figure(l, type)}<b>${l.name}</b><small>${label}</small></div>`;
      }).join('');
      setTempo();
    }
    function setTempo() {
      const bpm = Number(document.querySelector('[data-tempo]').value);
      stage.querySelectorAll('.fig').forEach((f) => f.style.setProperty('--beat', `${60 / bpm}s`));
    }
    document.querySelector('[data-new]').addEventListener('click', draw);
    document.querySelector('[data-tempo]').addEventListener('input', setTempo);
    draw();
  </script>
</body>
</html>
