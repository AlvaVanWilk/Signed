<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed – Probe: Label-Oberfläche</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    /* Ruhige Farben: dunkle Flächen, dünne Linien, ein einziger warmer Akzent; Status in gedämpften Tönen. */
    :root { --bg: #0f0e13; --card: #17151d; --line: #29252f; --text: #e8e4ef; --muted: #8d879c; --accent: #c9a86a;
      --ok: #5fb589; --warn: #d9a441; --bad: #c6585f; --off: #28242f; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 500; }
    .pl-top { display: flex; gap: 26px; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
    .pl-top a { color: var(--muted); text-decoration: none; font-weight: 600; padding: 6px 0; border-bottom: 2px solid transparent; }
    .pl-top a.on { color: var(--text); border-bottom-color: var(--accent); }
    .pl-logo { font-style: italic; font-weight: 800; font-size: 1.25rem; letter-spacing: -0.03em; color: var(--text); }
    .pl-badge { background: var(--accent); color: #17151d; font-size: 0.7rem; font-weight: 800; padding: 1px 7px; border-radius: 999px; margin-left: 4px; }
    .pl-switch { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 0.8rem; }
    .pl-switch button { border: 1px solid var(--line); background: none; color: var(--muted); padding: 5px 12px; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer; }
    .pl-switch button.on { color: var(--text); border-color: var(--accent); }
    .pl-layout { display: grid; grid-template-columns: 262px minmax(0, 1fr); gap: 26px; padding: 22px 24px 40px; max-width: 1240px; margin: 0 auto; }
    .pl-cap { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 700; margin: 0 0 10px; }

    /* Pegel (Aussteuerungsanzeige): 10 Segmente, unten rot, mittig gelb, oben grün */
    .pl-led { display: inline-flex; gap: 2px; align-items: flex-end; height: var(--h, 16px); }
    .pl-led i { width: var(--w, 5px); height: 100%; border-radius: 1px; background: var(--off); }
    .pl-led i.on.r { background: var(--bad); } .pl-led i.on.y { background: var(--warn); } .pl-led i.on.g { background: var(--ok); }
    .pl-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--c); }
    .pl-dot.green { --c: var(--ok); } .pl-dot.yellow { --c: var(--warn); } .pl-dot.red { --c: var(--bad); }
    .pl-word { font-weight: 700; font-size: 0.82rem; display: inline-flex; gap: 7px; align-items: center; }
    .pl-word.green { color: var(--ok); } .pl-word.yellow { color: var(--warn); } .pl-word.red { color: var(--bad); }
    body.a .only-b, body.b .only-a { display: none !important; }

    /* ---------- Band-Leiste ---------- */
    .pl-bar { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 14px; align-self: start; }
    .pl-bt { position: relative; display: grid; gap: 9px; padding: 13px 14px 12px 17px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); text-align: left; font: inherit; cursor: pointer; overflow: hidden; }
    .pl-bt::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--g); }
    .pl-bt.sel { border-color: var(--accent); background: #1d1a25; }
    .pl-bt .top { display: flex; gap: 10px; align-items: center; }
    .pl-bt .nm { font-weight: 700; font-size: 1rem; line-height: 1.15; }
    .pl-bt .gl { font-size: 0.7rem; color: var(--muted); font-weight: 600; margin-top: 2px; letter-spacing: 0.02em; }
    .pl-bt .stack { display: flex; margin-left: auto; flex: none; }
    .pl-bt .stack span { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; background: #cfdbe6; border: 2px solid var(--card); margin-left: -9px; display: block; }
    .pl-bt .stack span:first-child { margin-left: 0; }
    .pl-bt .stack svg { width: 100%; height: 100%; display: block; }
    .pl-bt .row { display: flex; align-items: center; gap: 14px; font-size: 0.82rem; font-weight: 600; color: var(--muted); }
    .pl-bt .row b { color: var(--text); font-weight: 700; }
    .pl-bt .mood { display: flex; align-items: center; gap: 8px; }
    .pl-pips { display: inline-flex; gap: 3px; } .pl-pips i { width: 8px; height: 8px; transform: rotate(45deg); background: var(--off); display: block; } .pl-pips i.on { background: var(--accent); }
    .pl-bt .wish { position: absolute; top: 10px; right: 12px; width: 18px; height: 15px; opacity: 0.9; }
    .pl-bt.busy::after { content: ''; position: absolute; left: 4px; right: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 60% 100%; background-repeat: no-repeat; animation: pl-run 1.8s linear infinite; }
    @keyframes pl-run { from { background-position: -60% 0; } to { background-position: 160% 0; } }
    .pl-bt.frozen { opacity: 0.72; } .pl-bt .fz { font-size: 0.68rem; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
    .pl-add { border: 1px dashed var(--line); color: var(--muted); background: none; border-radius: 12px; padding: 11px; font: inherit; font-weight: 600; cursor: pointer; }
    .pl-legend { margin-top: 18px; font-size: 0.75rem; color: var(--muted); display: grid; gap: 6px; }
    .pl-legend span { display: flex; gap: 9px; align-items: center; }

    /* ---------- Bandseite ---------- */
    .pl-pg { display: grid; gap: 16px; align-content: start; }
    .pl-hd { display: flex; gap: 16px; align-items: center; padding: 18px 20px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--g); }
    .pl-hd h1 { margin: 0; font-size: 1.55rem; font-weight: 700; letter-spacing: -0.01em; }
    .pl-hd small { color: var(--muted); font-weight: 600; }
    .pl-hd .mood { margin-left: auto; text-align: right; display: grid; gap: 7px; justify-items: end; }
    .pl-hd .mood .t { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 700; }
    .pl-acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pl-act { display: grid; grid-template-columns: 32px 1fr; gap: 2px 12px; align-items: center; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
    .pl-act svg { grid-row: span 2; width: 30px; height: 30px; stroke: var(--accent); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .pl-act b { font-weight: 700; } .pl-act small { color: var(--muted); font-weight: 500; font-size: 0.78rem; }
    .pl-act.warn { border-color: var(--warn); } .pl-act.lock { opacity: 0.4; cursor: not-allowed; }
    .pl-wishes { padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; gap: 10px; }
    .pl-ws { display: flex; gap: 12px; align-items: center; }
    .pl-ws .who { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: #cfdbe6; flex: none; } .pl-ws .who svg { width: 100%; height: 100%; display: block; }
    .pl-ws .say { background: #26222f; padding: 7px 13px; border-radius: 10px; font-size: 0.88rem; font-weight: 600; }
    .pl-ws button { margin-left: auto; border: 1px solid var(--accent); background: none; color: var(--accent); font: inherit; font-weight: 700; font-size: 0.82rem; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
    .pl-members { display: grid; gap: 6px; }
    .pl-mr { display: grid; grid-template-columns: 58px minmax(120px, 1.1fr) minmax(120px, 1fr) 76px minmax(110px, auto); gap: 16px; align-items: center; padding: 10px 16px 10px 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
    .pl-mr .ph { width: 58px; height: 58px; border-radius: 50%; overflow: hidden; background: linear-gradient(180deg, #cfdbe6, #b5c4d2); box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ring, transparent); }
    .pl-mr .ph svg { width: 100%; height: 100%; display: block; }
    .pl-mr b { display: block; font-weight: 700; } .pl-mr small { color: var(--muted); font-weight: 500; }
    .pl-mr .sk { display: block; height: 4px; border-radius: 2px; background: var(--off); overflow: hidden; margin-top: 7px; } .pl-mr .sk i { display: block; height: 100%; background: var(--lv); }
    .pl-rels { display: flex; gap: 6px; justify-content: flex-end; }
    .pl-rels i { width: 13px; height: 13px; border-radius: 50%; display: block; cursor: pointer; }
    .pl-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .pl-st { padding: 14px 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
    .pl-st span { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 700; display: block; }
    .pl-st b { font-size: 1.45rem; font-weight: 700; display: block; margin: 3px 0 7px; }
    .pl-st ul { margin: 0; padding: 0; list-style: none; font-size: 0.78rem; color: var(--muted); display: grid; gap: 3px; }
    .pl-st li { display: flex; justify-content: space-between; } .pl-st li b { display: inline; font-size: inherit; margin: 0; color: var(--text); font-weight: 700; }
    .pl-st li.up b { color: var(--ok); } .pl-st li.down b { color: var(--bad); }
    .pl-foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .pl-trophy { display: inline-flex; gap: 8px; align-items: center; padding: 6px 12px 6px 8px; border-radius: 999px; border: 1px solid #5a4a2c; background: #1c1812; font-size: 0.78rem; font-weight: 700; color: var(--accent); }
    .pl-trophy svg { width: 18px; height: 18px; fill: none; stroke: var(--accent); stroke-width: 1.5; }
    details.pl-chron { flex: 1; min-width: 200px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; } details.pl-chron summary { cursor: pointer; font-weight: 700; color: var(--muted); font-size: 0.85rem; }
    .pl-note { color: var(--muted); font-size: 0.82rem; max-width: 1240px; margin: 0 auto; padding: 0 24px 30px; }
  </style>
</head>
<body class="a">
<nav class="pl-top"><span class="pl-logo">Signed</span>
  <a>Übersicht</a><a class="on">Bands</a><a>Kartei</a><a>Einkaufen</a><a>Einsendungen <span class="pl-badge">7</span></a><a>Charts</a>
  <span class="pl-switch">Stimmung als: <button data-v="a" class="on">Pegel</button><button data-v="b">Punkt und Wort</button></span>
  <span style="font-weight:700;margin-left:18px">VanWilk · 1.320 ₲</span></nav>
<div class="pl-layout">
  <aside>
    <h2 class="pl-cap">Deine Bands</h2>
    <div class="pl-bar" data-lbar></div>
    <div class="pl-legend">
      <span class="only-a"><span class="pl-led" style="--h:12px;--w:4px"><i class="on r"></i><i class="on r"></i><i class="on y"></i><i class="on y"></i><i class="on g"></i><i class="on g"></i></span> Pegel hoch = gute Stimmung</span>
      <span class="only-b"><span class="pl-dot green"></span> gut · <span class="pl-dot yellow"></span> angespannt · <span class="pl-dot red"></span> unzufrieden</span>
    </div>
  </aside>
  <main class="pl-pg" data-page></main>
</div>
<p class="pl-note">Probe mit Beispieldaten, im Spiel ist noch nichts geändert. Oben rechts lässt sich die Anzeige der Stimmung umschalten.</p>
<script type="module">
  import { portrait } from './assets/js/figure.js';

  const $ = (s) => document.querySelector(s);
  const GENRE = { pop: '#b04a72', rock: '#b8602a', metal: '#6b7280', punk: '#7b9a2e', jazz: '#b58a1c', elektro: '#3d7cb5', hiphop: '#7a5bc4', folk: '#4d8a5a' };
  const GNAME = { pop: 'Pop', rock: 'Rock', metal: 'Metal', punk: 'Punk', jazz: 'Jazz', elektro: 'Elektro', hiphop: 'Hip-Hop', folk: 'Folk' };
  const INSTR = { guitar: 'Gitarre', bass: 'Bass', drums: 'Schlagzeug', vocals: 'Gesang', keys: 'Keyboard', sax: 'Saxophon' };
  const LV = ['#7d8291', '#4f9d69', '#4a86c8', '#9a5bc4'];
  const LVN = ['Anfänger', 'Fortgeschritten', 'Profi', 'Virtuose'];
  const MOODW = { green: 'gut', yellow: 'angespannt', red: 'unzufrieden' };
  const look = (gender, skin, hair, hairColor, shirt, extra = {}) => ({ gender, skin, hair, hairColor, shirt, beard: 'none', glasses: 'none', hat: 'none', ...extra });
  const P = {
    lena: { first: 'Lena', last: 'Berger', instr: 'vocals', lvl: 1, skill: 0.6, wb: 'green', look: look('f', '#eac0a2', 'lang', '#8a5a33', '#c8505a'), mood: 'ehrgeizig', id: 1 },
    finn: { first: 'Finn', last: 'Okafor', instr: 'guitar', lvl: 2, skill: 0.3, wb: 'green', look: look('m', '#6b3f27', 'locken', '#1d1612', '#3a4258', { beard: 'stubble' }), mood: 'gelassen', id: 2 },
    kim: { first: 'Kim', last: 'Novak', instr: 'drums', lvl: 1, skill: 0.8, wb: 'yellow', look: look('d', '#d9a27e', 'irokese', '#c0507a', '#3f8f78'), mood: 'chaot', id: 3 },
    ida: { first: 'Ida', last: 'Lindqvist', instr: 'bass', lvl: 1, skill: 0.2, wb: 'green', look: look('f', '#f6d7c3', 'bob', '#e3c88a', '#4a6fa5', { glasses: 'round' }), mood: 'teamplayer', id: 4 },
    svea: { first: 'Svea', last: 'Kaya', instr: 'keys', lvl: 0, skill: 0.5, wb: 'red', look: look('f', '#c58c63', 'zopf', '#a8442a', '#b8963c'), mood: 'diva', id: 5 },
    yusuf: { first: 'Yusuf', last: 'Demir', instr: 'sax', lvl: 3, skill: 0.9, wb: 'green', look: look('m', '#a86f4b', 'kurz', '#3b2a20', '#6c4aa0', { hat: 'fedora' }), mood: 'rampensau', id: 6 },
  };
  const BANDS = [
    { id: 1, name: 'Die Nachtfalter', genres: ['rock'], title: 'Rockband', mood: 'green', value: 71, songs: 7, fame: 2, members: ['lena', 'finn', 'kim', 'ida'], wish: 1, trophies: ['Goldene Schallplatte', 'Platz 1 der Charts'] },
    { id: 2, name: 'Neon Hasen', genres: ['pop', 'elektro'], title: 'Elektro-Pop-Band', mood: 'yellow', value: 48, songs: 14, fame: 1, members: ['ida', 'yusuf', 'svea'], wish: 2, busy: true, trophies: [] },
    { id: 3, name: 'Blech & Bass', genres: ['punk'], title: 'Punkband', mood: 'red', value: 22, songs: 3, fame: 0, members: ['kim', 'svea'], wish: 1, frozen: true, trophies: [] },
    { id: 4, name: 'Svea Kaya', genres: ['pop'], title: null, mood: 'green', value: 66, songs: 4, fame: 1, solo: 'svea', trophies: [] },
  ];

  const led = (value, o = {}) => {
    const n = Math.round(value / 10);
    return `<span class="pl-led" style="--h:${o.h ?? 16}px;--w:${o.w ?? 5}px">${Array.from({ length: 10 }, (_, i) => `<i class="${i < n ? 'on' : ''} ${i < 3 ? 'r' : i < 6 ? 'y' : 'g'}"></i>`).join('')}</span>`;
  };
  const moodMini = (b) => `<span class="only-a">${led(b.value, { h: 14, w: 4 })}</span><span class="only-b pl-word ${b.mood}"><span class="pl-dot ${b.mood}"></span>${MOODW[b.mood]}</span>`;
  const pips = (n) => `<span class="pl-pips" title="Ruhm">${[0, 1, 2].map((i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
  const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
  const relColor = (v) => `rgb(${mix([88, 84, 100], v >= 0 ? [86, 190, 140] : [214, 96, 104], Math.min(1, Math.abs(v) / 10)).join(',')})`;
  const bubble = '<svg class="wish" viewBox="0 0 24 20"><path d="M3 2h18a2 2 0 012 2v9a2 2 0 01-2 2h-9l-5 4v-4H3a2 2 0 01-2-2V4a2 2 0 012-2z" fill="none" stroke="#c9a86a" stroke-width="1.6"/></svg>';
  const ICON = {
    rehearse: '<svg viewBox="0 0 32 32"><path d="M10 28 L14 5 H18 L22 28 Z"/><path d="M16 22 L23 9"/><circle cx="23" cy="9" r="1.6"/></svg>',
    record: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12"/><circle cx="16" cy="16" r="4.5"/><path d="M16 4 V9"/></svg>',
    gig: '<svg viewBox="0 0 32 32"><rect x="12" y="4" width="8" height="15" rx="4"/><path d="M8 15 a8 8 0 0 0 16 0 M16 23 V28 M11 28 H21"/></svg>',
    lock: '<svg viewBox="0 0 32 32"><rect x="7" y="14" width="18" height="13" rx="3"/><path d="M11 14 V10 a5 5 0 0 1 10 0 V14"/></svg>',
  };
  const medal = '<svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="7"/><circle cx="12" cy="14" r="2.4"/><path d="M8 3 L12 9 L16 3"/></svg>';

  function tile(b, sel) {
    const people = (b.solo ? [b.solo] : b.members).map((k) => P[k]);
    return `<button class="pl-bt ${sel ? 'sel' : ''} ${b.busy ? 'busy' : ''} ${b.frozen ? 'frozen' : ''}" style="--g:${GENRE[b.genres[0]]}" data-id="${b.id}">
      <span class="top"><span><span class="nm">${b.name}</span><br><span class="gl">${b.solo ? 'Solokünstlerin · ' : ''}${b.genres.map((g) => GNAME[g]).join(' · ')}</span></span>
        <span class="stack">${people.slice(0, 4).map((m) => `<span>${portrait(m.look, m.mood)}</span>`).join('')}</span></span>
      <span class="mood">${moodMini(b)}${b.frozen ? '<span class="fz">wartet auf dich</span>' : ''}</span>
      <span class="row"><span>♪ <b>${b.songs}</b></span>${pips(b.fame)}</span>
      ${b.wish ? bubble : ''}</button>`;
  }
  let cur = 1;
  function bar() {
    $('[data-lbar]').innerHTML = BANDS.map((b) => tile(b, b.id === cur)).join('') + '<button class="pl-add">+ Band oder Solokünstler</button>';
    document.querySelectorAll('.pl-bt').forEach((el) => el.addEventListener('click', () => { cur = Number(el.dataset.id); bar(); page(); }));
  }

  function page() {
    const b = BANDS.find((x) => x.id === cur);
    const members = (b.solo ? [b.solo] : b.members).map((k) => P[k]);
    const rels = (m, i) => members.filter((x) => x !== m).map((x) => {
      const v = ((m.id * 7 + x.id * 13 + i * 3) % 21) - 10 + (b.mood === 'red' ? -6 : 0);
      return `<i style="background:${relColor(Math.max(-10, Math.min(10, v)))}" title="${m.first} und ${x.first}"></i>`;
    }).join('');
    const wbVal = { green: 75, yellow: 48, red: 20 };
    $('[data-page]').innerHTML = `
      <div class="pl-hd" style="--g:${GENRE[b.genres[0]]}">
        <div><h1>${b.name}</h1><small>${b.title ?? 'Solokünstlerin'} · ${b.genres.map((g) => GNAME[g]).join(' · ')}</small></div>
        <div class="mood"><span class="t">Stimmung</span>
          <span class="only-a">${led(b.value, { h: 26, w: 9 })}</span><span class="only-b pl-word ${b.mood}" style="font-size:1.1rem"><span class="pl-dot ${b.mood}" style="width:12px;height:12px"></span>${MOODW[b.mood]}</span></div>
      </div>
      <div class="pl-acts">
        <button class="pl-act ${b.frozen ? 'lock' : ''}">${b.frozen ? ICON.lock : ICON.rehearse}<b>Proben</b><small>${b.frozen ? 'Dazu hat die Band keine Lust.' : 'Können und Beziehungen wachsen · 15 Min.'}</small></button>
        <button class="pl-act ${b.songs >= 12 ? 'warn' : ''}">${ICON.record}<b>Aufnehmen</b><small>${b.songs} Songs fertig${b.songs >= 12 ? ' – sie warten!' : ''}</small></button>
        <button class="pl-act ${b.frozen ? 'lock' : ''}">${b.frozen ? ICON.lock : ICON.gig}<b>Auftritt buchen</b><small>${b.frozen ? 'Erst die Stimmung heben.' : 'Kosten und Gewinn sehen'}</small></button>
      </div>
      ${b.wish ? `<div class="pl-wishes"><div class="pl-cap" style="margin:0">Wünsche der Band</div>
        <div class="pl-ws"><span class="who">${portrait(members[0].look, members[0].mood)}</span><span class="say">${b.frozen ? 'Wir haben keine Lust mehr …' : 'Wann ist der nächste Gig?'}</span><button>Auftritt buchen</button></div>
        ${b.wish > 1 ? `<div class="pl-ws"><span class="who">${portrait(members[1].look, members[1].mood)}</span><span class="say">Ich brauche ein besseres Instrument.</span><button>Einkaufen</button></div>` : ''}</div>` : ''}
      <div class="pl-members">${members.map((m, i) => {
        const wb = b.frozen ? 'red' : m.wb;
        return `<div class="pl-mr" style="--lv:${LV[m.lvl]}">
          <span class="ph" style="--ring:${{ green: 'var(--ok)', yellow: 'var(--warn)', red: 'var(--bad)' }[wb]}">${portrait(m.look, m.mood)}</span>
          <span><b>${m.first} ${m.last}</b><small>${INSTR[m.instr]} · ${LVN[m.lvl]}</small></span>
          <span><small>Können</small><span class="sk"><i style="width:${m.skill * 100}%"></i></span></span>
          <span><span class="only-a">${led(wbVal[wb], { h: 14, w: 5 })}</span><span class="only-b pl-word ${wb}"><span class="pl-dot ${wb}"></span></span></span>
          <span class="pl-rels">${members.length > 1 ? rels(m, i) : '<small>solo</small>'}</span>
        </div>`; }).join('')}</div>
      <div class="pl-stats">
        <div class="pl-st"><span>Sound</span><b>${b.solo ? '14' : 31 + b.fame * 4}</b><ul><li>Können Ø <b>${b.solo ? 25 : 46}</b></li><li class="up">Genre <b>${b.solo ? '–' : '+15 %'}</b></li><li>Besetzung <b>${b.solo ? '–' : '+10 %'}</b></li><li>Instrumente <b>+8 %</b></li></ul></div>
        <div class="pl-st"><span>Ruhm</span><b>${[0, 18, 140, 720][b.fame]}</b><ul><li>Stufe <b>${['Unbekannt', 'Lokal bekannt', 'Szenegröße', 'Star'][b.fame]}</b></li><li>Platten <b>${b.fame}</b></li><li>Auftritte <b>${b.fame * 3}</b></li></ul></div>
        <div class="pl-st"><span>Zusammenhalt</span><b>${b.solo ? '–' : '+4,2'}</b><ul>${b.solo ? '<li>keine Mitmusiker</li>' : '<li class="up">beste <b>+8</b></li><li class="down">schwächste <b>−3</b></li><li>Ø <b>+4,2</b></li>'}</ul></div>
        <div class="pl-st"><span>Stimmung</span><b>${b.value}</b><ul>${b.songs >= 12 ? '<li class="down">Songs liegen rum <b>−' + (b.songs - 11) + '</b></li>' : '<li class="up">Songs <b>ok</b></li>'}<li class="up">Beziehungen <b>+8</b></li>${b.mood !== 'green' ? '<li class="down">offene Wünsche <b>−6</b></li>' : ''}<li>Genre <b>passt</b></li></ul></div>
      </div>
      <div class="pl-foot">${b.trophies.map((t) => `<span class="pl-trophy">${medal}${t}</span>`).join('')}
        <details class="pl-chron"><summary>Chronik</summary><div style="padding-top:6px;color:var(--muted);font-size:.85rem">Heute: ${b.members ? 'Kim hat sich über die vielen Proben geärgert.' : 'Erste Platte veröffentlicht.'}</div></details></div>`;
  }
  document.querySelectorAll('.pl-switch button').forEach((el) => el.addEventListener('click', () => {
    document.body.className = el.dataset.v;
    document.querySelectorAll('.pl-switch button').forEach((x) => x.classList.toggle('on', x === el));
  }));
  bar(); page();
</script>
</body>
</html>
